<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="pr-l-bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="pr-l-mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pr-l-arc" x1="780" y1="220" x2="1110" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="pr-l-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Surface -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#pr-l-bg)" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="945" cy="140" r="145" fill="url(#pr-l-glow)"/>

  <!-- Left: Brand Mark -->
  <g transform="translate(52, 54)">
    <rect width="64" height="64" rx="14" fill="url(#pr-l-mark)"/>
    <circle cx="32" cy="32" r="18" stroke="#10B981" stroke-width="3" stroke-dasharray="34 8 24 8 30 9" stroke-opacity="0.35"/>
    <path d="M 16 46 Q 22 22 48 18" stroke="#34D399" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="14" y1="44" x2="50" y2="14" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="3 3" stroke-opacity="0.85"/>
    <circle cx="29" cy="27" r="4.2" fill="#FBBF24" stroke="#064E3B" stroke-width="1.5"/>
    <circle cx="19" cy="39" r="2.6" fill="#34D399"/>
    <circle cx="43" cy="20" r="2.6" fill="#34D399"/>
  </g>

  <!-- Left: Typography -->
  <text x="136" y="98" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em">Portfolio Research</text>
  <text x="52" y="156" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500">Walk-forward US equity factor research with Deflated Sharpe &amp; PBO</text>

  <!-- Left: Tech Pill -->
  <rect x="52" y="188" width="340" height="34" rx="17" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
  <circle cx="72" cy="205" r="4" fill="#10B981"/>
  <text x="86" y="210" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">Walk-Forward  •  DSR &amp; PBO  •  3.10+</text>

  <!-- Right: Efficient Frontier Curve Artwork -->
  <!-- Risk-Return Axes -->
  <g stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round">
    <line x1="760" y1="44" x2="760" y2="232"/>
    <line x1="760" y1="232" x2="1136" y2="232"/>
  </g>
  <g stroke="#CBD5E1" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 4">
    <line x1="760" y1="106" x2="1136" y2="106"/>
    <line x1="760" y1="168" x2="1136" y2="168"/>
    <line x1="885" y1="44" x2="885" y2="232"/>
    <line x1="1010" y1="44" x2="1010" y2="232"/>
  </g>

  <!-- Dominated / Suboptimal Portfolio Cloud -->
  <g fill="#94A3B8" fill-opacity="0.45">
    <circle cx="845" cy="186" r="4"/>
    <circle cx="878" cy="162" r="3.5"/>
    <circle cx="910" cy="192" r="4"/>
    <circle cx="932" cy="154" r="3.5"/>
    <circle cx="965" cy="176" r="4"/>
    <circle cx="998" cy="144" r="3.5"/>
    <circle cx="1028" cy="162" r="4"/>
    <circle cx="1062" cy="134" r="3.5"/>
    <circle cx="892" cy="138" r="3"/>
    <circle cx="950" cy="128" r="3"/>
  </g>

  <!-- Efficient Frontier Curve -->
  <path d="M798 206 Q825 104 1110 74" stroke="url(#pr-l-arc)" stroke-width="4" stroke-linecap="round"/>

  <!-- Capital Market Line (Tangent at Optimal Sharpe Portfolio) -->
  <line x1="760" y1="210" x2="1086" y2="48" stroke="#D97706" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Frontier Nodes & Tangency Portfolio -->
  <circle cx="814" cy="164" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="972" cy="96" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="1110" cy="74" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="888" cy="126" r="8.5" fill="#FBBF24" stroke="#064E3B" stroke-width="2.5"/>
</svg>
